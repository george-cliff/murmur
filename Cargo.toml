[package]
name = "murmur"
version = "0.8.0"
edition = "2024"

[dependencies]
hound = "3.5.1"
image = "0.25.10"
moontool = "1.3.0"
ndarray = "0.17.2"
ort = "2.0.0-rc.12"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
rubato = "3.0.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
spectrs = { version = "0.2.1", default-features = false }
